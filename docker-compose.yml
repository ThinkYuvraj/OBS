services:
  broadcast-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketinglu/obs-broadcast-engine:latest
    container_name: marketinglu_broadcast_engine
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_marketinGlu_subsecond}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_sec_live_9842_sky_hd}
      - PAYTM_MID=${PAYTM_MID:-MKTGLU_LIVE_9842}
      - HOSTINGER_DB_HOST=${HOSTINGER_DB_HOST:-}
      - HOSTINGER_DB_USER=${HOSTINGER_DB_USER:-}
      - HOSTINGER_DB_PASSWORD=${HOSTINGER_DB_PASSWORD:-}
      - HOSTINGER_DB_NAME=${HOSTINGER_DB_NAME:-u123456789_broadcast_db}
      - HOSTINGER_DB_PORT=${HOSTINGER_DB_PORT:-3306}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - broadcast_net

networks:
  broadcast_net:
    driver: bridge
