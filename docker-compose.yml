version: '3.8'

services:
  broadcast-suite:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketinglu-obs-broadcast:latest
    container_name: marketinglu_broadcast_engine
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_marketinGlu_subsecond}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_sec_live_9842_sky_hd}
      - HOSTINGER_DB_HOST=${HOSTINGER_DB_HOST:-}
      - HOSTINGER_DB_USER=${HOSTINGER_DB_USER:-}
      - HOSTINGER_DB_PASSWORD=${HOSTINGER_DB_PASSWORD:-}
      - HOSTINGER_DB_NAME=${HOSTINGER_DB_NAME:-u123456789_broadcast_db}
      - HOSTINGER_DB_PORT=${HOSTINGER_DB_PORT:-3306}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
