<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MarketinGlu OBS - Live Sports ScoreBug</title>
    <meta name="description" content="Professional real-time broadcast score overlays for OBS, vMix, and live streaming with ball-by-ball scoring, multi-sport engine, and graphics customization." />
    <meta property="og:title" content="MarketinGlu OBS - Live Sports ScoreBug" />
    <meta property="og:description" content="Professional real-time broadcast score overlays for OBS, vMix, and live streaming with ball-by-ball scoring, multi-sport engine, and graphics customization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/marketinglu-emblem-dark.png" />
    <link rel="apple-touch-icon" href="/marketinglu-emblem-dark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Chakra+Petch:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background:#040814;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;color:#f1f5f9;text-align:center;padding:24px;position:relative;">
        <!-- Ambient Cyan Glow -->
        <div style="position:absolute;width:420px;height:420px;background:rgba(6,182,212,0.12);border-radius:50%;filter:blur(110px);pointer-events:none;"></div>

        <!-- 1. Top Logo Emblem Card (Dark rounded frame with rim glow + white inner card) -->
        <div style="position:relative;margin-bottom:28px;z-index:2;">
          <div style="background:#091122;border:1px solid rgba(6,182,212,0.35);border-radius:24px;padding:14px;box-shadow:0 0 35px rgba(6,182,212,0.35);display:flex;align-items:center;justify-content:center;width:220px;height:140px;box-sizing:border-box;">
            <div style="background:#ffffff;border-radius:16px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;">
              <img src="/marketinglu-emblem.png" alt="MarketinGlu Emblem" style="max-height:76px;width:auto;object-contain:contain;" />
            </div>
          </div>
        </div>

        <!-- 2. Wordmark: MARKETIN GLU -->
        <img src="/marketinglu-wordmark.png" alt="MARKETINGLU" style="width:260px;height:auto;margin-bottom:14px;filter:drop-shadow(0 2px 10px rgba(6,182,212,0.45));z-index:2;" />

        <!-- 3. Subtitle Pill: ⚡ SOFTWARE & DIGITAL GROWTH ENGINE -->
        <div style="margin-bottom:32px;z-index:2;">
          <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 18px;border-radius:999px;border:1px solid rgba(6,182,212,0.4);background:rgba(6,21,40,0.8);color:#67e8f9;font-family:monospace;font-size:11px;font-weight:700;letter-spacing:1px;box-shadow:0 0 15px rgba(6,182,212,0.2);">
            <span style="color:#22d3ee;font-size:12px;">⚡</span>
            <span>SOFTWARE &amp; DIGITAL GROWTH ENGINE</span>
          </div>
        </div>

        <!-- 4. Progress Bar & Telemetry Status Row -->
        <div style="width:340px;max-width:90vw;z-index:2;">
          <!-- Progress Track -->
          <div style="width:100%;height:6px;background:#0c1626;border-radius:999px;overflow:hidden;border:1px solid rgba(6,182,212,0.2);position:relative;">
            <div style="width:81%;height:100%;background:linear-gradient(90deg,#06b6d4,#38bdf8);border-radius:999px;box-shadow:0 0 12px #06b6d4;"></div>
          </div>

          <!-- Status Row: Left msg, Tag, 81% -->
          <div style="display:flex;align-items:center;justify-content:space-between;font-family:monospace;font-size:11px;margin-top:10px;">
            <div style="display:flex;align-items:center;gap:8px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
              <span style="width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee;display:inline-block;"></span>
              <span style="font-weight:500;">Calibrating 144Hz Smooth Engine &amp; ...</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
              <span style="color:#06b6d4;font-weight:700;">[GPU_ACCEL]</span>
              <span style="color:#67e8f9;font-weight:800;font-size:12px;">81%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
