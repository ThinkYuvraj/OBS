<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MarketinGlu OBS - Live Sports ScoreBug</title>
    <meta name="description" content="Professional real-time broadcast score overlays for OBS, vMix, and live streaming with ball-by-ball scoring, multi-sport engine, and graphics customization." />
    <meta property="og:title" content="MarketinGlu OBS - Live Sports ScoreBug" />
    <meta property="og:description" content="Professional real-time broadcast score overlays for OBS, vMix, and live streaming with ball-by-ball scoring, multi-sport engine, and graphics customization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/marketinglu-emblem-dark.png" />
    <link rel="apple-touch-icon" href="/marketinglu-emblem-dark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Chakra+Petch:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background:#070b14;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;color:#f1f5f9;text-align:center;padding:24px;">
        <div style="position:relative;margin-bottom:24px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;width:190px;height:190px;border-radius:50%;border:2px solid rgba(6,182,212,0.25);border-top-color:#06b6d4;border-right-color:rgba(59,130,246,0.6);animation:mglSpin 3.5s linear infinite;"></div>
          <img src="/marketinglu-emblem-dark.png" alt="MarketinGlu Logo" style="width:140px;height:auto;filter:drop-shadow(0 0 20px rgba(6,182,212,0.85));animation:mglPulse 2s ease-in-out infinite;" />
        </div>
        <img src="/marketinglu-wordmark.png" alt="MARKETINGLU" style="width:180px;height:auto;margin-bottom:14px;filter:drop-shadow(0 2px 8px rgba(6,182,212,0.4));" />
        <div style="font-family:monospace;font-size:11px;color:#06b6d4;letter-spacing:2px;font-weight:700;margin-bottom:16px;">
          SUB-SECOND BROADCAST ENGINE • ISO 9001:2015
        </div>
        <div style="width:220px;height:4px;background:#0d1527;border-radius:999px;overflow:hidden;border:1px solid rgba(6,182,212,0.3);">
          <div style="width:70%;height:100%;background:linear-gradient(90deg,#06b6d4,#3b82f6);border-radius:999px;animation:mglBar 1.5s ease-in-out infinite alternate;"></div>
        </div>
        <style>
          @keyframes mglSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes mglPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(6,182,212,0.7)); } 50% { transform: scale(1.04); filter: drop-shadow(0 0 28px rgba(6,182,212,1)); } }
          @keyframes mglBar { 0% { width: 30%; } 100% { width: 95%; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
