services:
  broadcast-dev:
    image: node:20-alpine
    container_name: marketinglu_broadcast_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    command: sh -c "npm install && npm run dev"
    networks:
      - broadcast_dev_net

networks:
  broadcast_dev_net:
    driver: bridge
